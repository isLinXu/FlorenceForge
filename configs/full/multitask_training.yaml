# Florence-2 多任务Full Training配置
# 适用于: 所有任务的联合训练
# 训练模式: Full Training (非LoRA)

# 基本训练参数
num_epochs: 8
max_steps: null
eval_steps: 500
save_steps: 1000
logging_steps: 50

# 输出和日志
output_dir: "./outputs/florence2_multitask_full"
logging_dir: "./outputs/florence2_multitask_full/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置 - Full training需要更多梯度累积
gradient_accumulation_steps: 24

# 检查点管理
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: "eval_average_score"
greater_is_better: true

# 早停
early_stopping_patience: 8
early_stopping_threshold: 0.001

# 实验跟踪
experiment_name: "florence2_multitask_full_training"
run_name: "multitask_full_baseline_v1"
tags:
  - "florence2"
  - "multitask"
  - "computer-vision"
  - "vision-language"
  - "full-training"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-base"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: false  # 关键设置：禁用LoRA，使用Full Training

# 数据配置
data_config:
  batch_size: 1  # Full training显存占用大，使用小batch size
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # 数据增强 - 多任务通用
  use_augmentation: true
  augmentation_prob: 0.3
  
  # 数据平衡 - 多任务需要更大的数据集
  use_balanced_sampling: true
  max_samples_per_task: 15000

# 优化配置
optimization_config:
  learning_rate: 6.0e-06  # Full training使用更小的学习率
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "cosine_with_restarts"
  warmup_ratio: 0.2  # 多任务训练增加预热比例
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "adaptive"  # 多任务使用自适应策略
  temperature: 1.2
  update_frequency: 300
  
  # 任务权重配置
  task_weights:
    CAPTION: 1.0
    DETAILED_CAPTION: 1.0
    MORE_DETAILED_CAPTION: 1.0
    OD: 1.2  # 目标检测稍微增加权重
    DENSE_REGION_CAPTION: 1.0
    REGION_PROPOSAL: 0.8
    OCR: 1.1  # OCR稍微增加权重
    OCR_WITH_REGION: 1.1
    SEGMENTATION: 1.2  # 分割任务稍微增加权重
    REGION_TO_SEGMENTATION: 1.0
    OPEN_VOCABULARY_DETECTION: 1.0
    REGION_TO_CATEGORY: 1.0
    REGION_TO_DESCRIPTION: 1.0
    PHRASE_GROUNDING: 1.0
    REFERRING_EXPRESSION_SEGMENTATION: 1.1