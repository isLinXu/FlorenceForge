# Florence-2 区域到类别任务Full Training配置
# 适用于: REGION_TO_CATEGORY
# 训练模式: Full Training (非LoRA)

# 基本训练参数
num_epochs: 4
max_steps: null
eval_steps: 250
save_steps: 500
logging_steps: 50

# 输出和日志
output_dir: "./outputs/florence2_region_to_category_full"
logging_dir: "./outputs/florence2_region_to_category_full/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置 - Full training需要更多梯度累积
gradient_accumulation_steps: 12

# 检查点管理
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: "eval_accuracy"
greater_is_better: true

# 早停
early_stopping_patience: 4
early_stopping_threshold: 0.001

# 实验跟踪
experiment_name: "florence2_region_to_category_full_training"
run_name: "region_to_category_full_baseline_v1"
tags:
  - "florence2"
  - "region-to-category"
  - "classification"
  - "region-analysis"
  - "full-training"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-base"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: false  # 关键设置：禁用LoRA，使用Full Training

# 数据配置
data_config:
  batch_size: 2  # 分类任务可以使用稍大的batch size
  num_workers: 2
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # 数据增强 - 区域到类别专用
  use_augmentation: true
  augmentation_prob: 0.4
  
  # 数据平衡
  use_balanced_sampling: true
  max_samples_per_task: 15000

# 优化配置
optimization_config:
  learning_rate: 1.2e-05  # Full training使用更小的学习率
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1  # 分类任务预热比例可以小一些
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "round_robin"  # 区域到类别使用轮询策略
  temperature: 1.0
  update_frequency: 100