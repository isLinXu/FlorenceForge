# Florence-2 Multi-task Training Configuration Sample
# This is a comprehensive example configuration file for training Florence-2 models

# Basic Training Parameters
num_epochs: 10
max_steps: null
eval_steps: 500
save_steps: 1000
logging_steps: 100

# Output and Logging
output_dir: "./outputs/florence2_multitask"
logging_dir: "./outputs/florence2_multitask/logs"

# Mixed Precision Training
use_fp16: false
use_bf16: true

# Gradient Settings
gradient_accumulation_steps: 4

# Checkpoint Management
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Early Stopping
early_stopping_patience: 5
early_stopping_threshold: 0.001

# Experiment Tracking
experiment_name: "florence2_multitask_experiment"
run_name: "baseline_run_v1"
tags:
  - "florence2"
  - "multitask"
  - "vision-language"
  - "baseline"

# Model Configuration
model_config:
  model_name: "microsoft/Florence-2-large"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: true
  
  # LoRA Configuration
  lora_config:
    r: 32
    lora_alpha: 32
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"

# Data Configuration
data_config:
  batch_size: 4
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # Data Augmentation
  use_augmentation: false
  augmentation_prob: 0.5
  
  # Data Balancing
  use_balanced_sampling: true
  max_samples_per_task: null

# Optimization Configuration
optimization_config:
  learning_rate: 1.0e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # Learning Rate Scheduling
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  warmup_steps: null

# Task Scheduling Configuration
task_scheduling_config:
  strategy: "round_robin"  # Options: round_robin, weighted, curriculum
  temperature: 1.0
  update_frequency: 100
  
  # Curriculum Learning
  curriculum_start_epoch: 0
  curriculum_end_epoch: 10

# Metadata (automatically added when saving)
_metadata:
  created_at: "2024-01-20T10:30:00"
  config_version: "1.0"
  description: "Florence-2 Multi-task Training Configuration"