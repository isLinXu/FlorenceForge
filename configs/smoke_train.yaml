num_epochs: 1
max_steps: 5
output_dir: "./outputs/smoke_test"
gradient_accumulation_steps: 1
use_fp16: false
use_bf16: false

device: "cpu"

device_config:
  device: "cpu"
  mixed_precision: "no"

model_config:
  model_name: "microsoft/Florence-2-base"
  backend_name: "florence-2"
  trust_remote_code: true
  torch_dtype: "float32"
  device: "cpu"
  device_map: "auto"
  attn_implementation: "sdpa"
  use_lora: true
  lora_config:
    r: 8
    lora_alpha: 16
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"

data_config:
  batch_size: 1
  num_workers: 0
  pin_memory: false
  shuffle: false

optimization_config:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1

task_scheduling_config:
  strategy: "weighted"
  temperature: 1.0
