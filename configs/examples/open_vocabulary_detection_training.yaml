# Florence-2 开放词汇目标检测训练配置
# 适用于: OPEN_VOCABULARY_DETECTION

# 基本训练参数
num_epochs: 15
max_steps: null
eval_steps: 500
save_steps: 1000
logging_steps: 50

# 输出和日志
output_dir: "./outputs/florence2_open_vocabulary_detection"
logging_dir: "./outputs/florence2_open_vocabulary_detection/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置
gradient_accumulation_steps: 4

# 检查点管理
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# 早停
early_stopping_patience: 5
early_stopping_threshold: 0.001

# 实验跟踪
experiment_name: "florence2_open_vocabulary_detection_training"
run_name: "open_vocab_detection_baseline_v1"
tags:
  - "florence2"
  - "open_vocabulary_detection"
  - "object_detection"
  - "vision-language"
  - "zero_shot"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-large"  # 使用大模型支持开放词汇
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: true
  
  # LoRA配置 - 针对开放词汇检测任务优化
  lora_config:
    r: 64  # 较高的rank支持开放词汇理解
    lora_alpha: 128
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    lora_dropout: 0.1
    bias: "none"
    task_type: "CAUSAL_LM"

# 数据配置
data_config:
  batch_size: 6
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # 数据增强 - 开放词汇检测任务适用
  use_augmentation: true
  augmentation_prob: 0.5  # 较高的增强概率提高泛化能力
  
  # 数据平衡
  use_balanced_sampling: true
  max_samples_per_task: 15000

# 优化配置
optimization_config:
  learning_rate: 2.0e-05  # 适中的学习率用于检测任务
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "weighted"  # 开放词汇检测任务使用加权策略
  temperature: 1.0
  update_frequency: 100