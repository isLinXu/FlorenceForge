# Florence-2 图像分割任务训练配置
# 适用于: REGION_TO_SEGMENTATION, REFERRING_EXPRESSION_SEGMENTATION

# 基本训练参数
num_epochs: 10
max_steps: null
eval_steps: 400
save_steps: 800
logging_steps: 50

# 输出和日志
output_dir: "./outputs/florence2_segmentation"
logging_dir: "./outputs/florence2_segmentation/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置
gradient_accumulation_steps: 8

# 检查点管理
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: "eval_miou"
greater_is_better: true

# 早停
early_stopping_patience: 6
early_stopping_threshold: 0.001

# 实验跟踪
experiment_name: "florence2_segmentation"
run_name: "seg_baseline_v1"
tags:
  - "florence2"
  - "segmentation"
  - "computer-vision"
  - "pixel-level"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-large"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: true
  
  # LoRA配置 - 针对分割任务优化
  lora_config:
    r: 64
    lora_alpha: 128
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    lora_dropout: 0.1
    bias: "none"
    task_type: "CAUSAL_LM"

# 数据配置
data_config:
  batch_size: 2  # 分割任务显存需求大
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # 数据增强 - 分割专用
  use_augmentation: true
  augmentation_prob: 0.6
  
  # 数据平衡
  use_balanced_sampling: true
  max_samples_per_task: 12000

# 优化配置
optimization_config:
  learning_rate: 5.0e-06  # 分割任务使用较小学习率
  weight_decay: 0.05
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "polynomial"
  warmup_ratio: 0.1
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "weighted"  # 分割任务使用加权策略
  temperature: 1.2
  update_frequency: 200