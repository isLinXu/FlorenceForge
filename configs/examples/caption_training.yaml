# Florence-2 图像描述任务训练配置
# 适用于: CAPTION, DETAILED_CAPTION, MORE_DETAILED_CAPTION

# 基本训练参数
num_epochs: 5
max_steps: null
eval_steps: 200
save_steps: 500
logging_steps: 50

# 输出和日志
output_dir: "./outputs/florence2_caption"
logging_dir: "./outputs/florence2_caption/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置
gradient_accumulation_steps: 4

# 检查点管理
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# 早停
early_stopping_patience: 3
early_stopping_threshold: 0.001

# 实验跟踪
experiment_name: "florence2_caption_training"
run_name: "caption_baseline_v1"
tags:
  - "florence2"
  - "caption"
  - "image-description"
  - "vision-language"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-base"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: true
  
  # LoRA配置 - 针对文本生成任务优化
  lora_config:
    r: 32
    lora_alpha: 64
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"

# 数据配置
data_config:
  batch_size: 1
  num_workers: 0
  pin_memory: false
  shuffle: false
  drop_last: false
  
  # 数据增强 - 图像描述任务适用
  use_augmentation: true
  augmentation_prob: 0.3
  
  # 数据平衡
  use_balanced_sampling: true
  max_samples_per_task: 10000

# 优化配置
optimization_config:
  learning_rate: 2.0e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "weighted"  # 图像描述任务使用加权策略
  temperature: 1.0
  update_frequency: 100