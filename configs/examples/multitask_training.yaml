# Florence-2 多任务混合训练配置
# 同时训练多个任务: CAPTION, OD, OCR, REGION_TO_SEGMENTATION

# 基本训练参数
num_epochs: 12
max_steps: null
eval_steps: 500
save_steps: 1000
logging_steps: 100

# 输出和日志
output_dir: "./outputs/florence2_multitask"
logging_dir: "./outputs/florence2_multitask/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置
gradient_accumulation_steps: 8

# 检查点管理
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: "eval_avg_score"
greater_is_better: true

# 早停
early_stopping_patience: 8
early_stopping_threshold: 0.001

# 实验跟踪
experiment_name: "florence2_multitask_training"
run_name: "multitask_baseline_v1"
tags:
  - "florence2"
  - "multitask"
  - "vision-language"
  - "unified-model"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-large"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: true
  
  # LoRA配置 - 多任务优化
  lora_config:
    r: 64
    lora_alpha: 128
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    lora_dropout: 0.1
    bias: "none"
    task_type: "CAUSAL_LM"
    


# 数据配置
data_config:
  batch_size: 4
  num_workers: 6
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # 多任务数据增强
  use_augmentation: true
  augmentation_prob: 0.4
  
  # 数据平衡
  use_balanced_sampling: true
  max_samples_per_task: 8000

# 优化配置
optimization_config:
  learning_rate: 1.0e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "cosine_with_restarts"
  warmup_ratio: 0.1
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "adaptive"  # 自适应任务调度
  temperature: 1.0
  update_frequency: 200