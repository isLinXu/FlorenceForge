# Florence-2 Production Configuration
# 生产环境配置 - 适合正式训练和部署

# 训练设置
num_epochs: 20
max_steps: null
eval_steps: 200
save_steps: 500
logging_steps: 50

# 输出和日志
output_dir: "./outputs/production_run"
logging_dir: "./outputs/production_run/logs"

# 混合精度训练
use_fp16: false
use_bf16: true

# 梯度设置
gradient_accumulation_steps: 4

# 检查点管理
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# 早停机制
early_stopping_patience: 3
early_stopping_threshold: 0.0005

# 实验跟踪
experiment_name: "florence2_production"
run_name: "production_v1"
tags:
  - "production"
  - "florence2"
  - "multitask"
  - "stable"

# 模型配置
model_config:
  model_name: "microsoft/Florence-2-large"
  trust_remote_code: true
  torch_dtype: "auto"
  device_map: "auto"
  attn_implementation: "flash_attention_2"
  use_lora: true
  
  # 生产级LoRA配置
  lora_config:
    r: 64                    # 更高的rank获得更好性能
    lora_alpha: 128
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    lora_dropout: 0.05       # 较低的dropout
    bias: "none"
    task_type: "CAUSAL_LM"

# 数据配置
data_config:
  batch_size: 8
  num_workers: 8
  pin_memory: true
  shuffle: true
  drop_last: true
  
  # 数据增强
  use_augmentation: true
  augmentation_prob: 0.3
  
  # 数据平衡
  use_balanced_sampling: true
  max_samples_per_task: 10000

# 优化配置
optimization_config:
  learning_rate: 1.0e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  
  # 学习率调度
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05       # 较短的warmup
  warmup_steps: null

# 任务调度配置
task_scheduling_config:
  strategy: "weighted"     # 使用加权策略
  temperature: 0.8         # 较低的温度获得更稳定的调度
  update_frequency: 100
  
  # 课程学习
  curriculum_start_epoch: 2
  curriculum_end_epoch: 15