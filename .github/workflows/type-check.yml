name: Type Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'florence_forge/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/type-check.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'florence_forge/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/type-check.yml'

jobs:
  mypy:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[dev]"

      - name: Run MyPy
        run: |
          mypy florence_forge --config-file pyproject.toml --show-error-codes

  pyright:
    name: Pyright Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyright
          pip install -e ".[dev]"

      - name: Run Pyright
        run: |
          pyright florence_forge --pythonversion ${{ matrix.python-version }}
