name: Type Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'florence_forge/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/type-check.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'florence_forge/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/type-check.yml'

jobs:
  mypy:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mypy>=1.5.0,<2.0.0" types-PyYAML
          pip install -e ".[dev]"

      - name: Run MyPy (lightweight subset)
        run: |
          mypy \
            florence_forge/evaluation/task_metrics \
            florence_forge/evaluation/advanced_metrics_registry.py \
            florence_forge/evaluation/evaluator_reporting.py \
            florence_forge/evaluation/unified_metrics.py \
            florence_forge/utils/console.py \
            florence_forge/training/rewards \
            --config-file pyproject.toml --show-error-codes
